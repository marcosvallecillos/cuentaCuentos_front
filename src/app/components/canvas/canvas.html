<div class="canvas-container">
  <div class="toolbar">
    <div class="colors">
      @for (color of colors; track color) {
        <div 
          class="color-btn"
          [style.background]="color"
          [class.active]="currentColor === color"
          (click)="selectColor(color)">
        </div>
      }
    </div>
    
    <button class="tool-btn" (click)="undo()">
      {{getText('↶ Deshacer', '↶ Undo')}}
    </button>
    
    <button class="tool-btn" (click)="clear()">
      {{getText('🗑️ Borrar', '🗑️ Clear')}}
    </button>
  </div>

  <canvas 
    #drawingCanvas
    class="drawing-canvas"
    (mousedown)="startDrawing($event)"
    (mousemove)="draw($event)"
    (mouseup)="stopDrawing()"
    (mouseleave)="stopDrawing()">
  </canvas>

  <div class="submit-section">
    <input 
      type="text" 
      [(ngModel)]="objectLabel" 
      placeholder="{{getText('¿Qué has dibujado?', 'What did you draw?')}}"
      class="object-input"
      (keyup.enter)="submitDrawing()">
    
    <button class="submit-btn" (click)="submitDrawing()">
      {{getText('✨ ¡Crear Historia!', '✨ Create Story!')}}
    </button>
  </div>
</div>
